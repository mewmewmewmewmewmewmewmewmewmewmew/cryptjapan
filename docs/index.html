  // ── Phygitals marketplace integration ───────────────────────────────
  function normalizePhygitalsCard(item) {
    const meta = item.metadata ?? [];  // [{key, value}, ...]
    const attr = name => meta.find(m => (m.key ?? "").toLowerCase() === name.toLowerCase())?.value ?? null;
    const grader   = attr("Grader") ?? "";
    const gradeRaw = attr("Grade") ?? "";
    // "CGC 9.0" → "9.0", "PSA 10" → "10" — strip leading grader prefix
    const grade    = gradeRaw.replace(/^[A-Za-z]+\s*/, "").trim();
    const language = attr("Language") ?? "";
    const set      = attr("Set") ?? attr("Set Name") ?? "";
    const yearRaw  = attr("Year") ?? attr("Set Release Date") ?? "";
    const title    = attr("Title") ?? item.name ?? "";
    const serial   = attr("Cert Number") ?? attr("Cert") ?? attr("Serial") ?? "";
    // price is micro-USDC (6 decimal places)
    const priceUsdc = item.price != null ? parseFloat(item.price) / 1_000_000 : null;
    const createdAt = item.createdAt ?? item.listedAt ?? null;
    const isoDate   = createdAt ? new Date(createdAt).toISOString() : null;
    const address   = item.address ?? item.mintAddress ?? "";
    const cardUrl   = `https://www.phygitals.com/card/${address}`;
    return {
      nftAddress:     `phygitals-${address}`,
      gradingID:      serial || address,
      gradingCompany: grader,
      grade,
      year:           parseInt(yearRaw) || null,
      language,
      cardName:       "",
      name:           "",
      set,
      itemName:       title,
      listing:        { price: priceUsdc, currency: "USDC", createdAt: isoDate, updatedAt: isoDate },
      _source:        "phygitals",
      _cardUrl:       cardUrl,
      _altCardName:   "",
    };
  }

  async function fetchPhygitalsListings() {
    const btn = document.getElementById("fetch-btn");
    const status = document.getElementById("status");
    btn.disabled = true;
    status.textContent = "Fetching Phygitals listings…";
    document.getElementById("results-body").innerHTML = "";
    document.getElementById("empty-msg").style.display = "none";
    allRows = [];

    // Build server-side metadataConditions from dropdown selections
    const metaCond = {
      "set": [], "grader": [], "grade": [], "rarity": [], "type": [],
      "set release date": [], "grade type": ["Graded Cards"],
      "language": [], "category": ["Pokemon"],
    };

    const gc = document.getElementById("gradingCompany")?.value;
    const graderAbbrev = gc === "Beckett" ? "BGS" : gc;
    if (graderAbbrev) metaCond["grader"] = [graderAbbrev];

    for (const g of getSelectedGrades()) {
      // Phygitals grade format: "{GRADER} {N}.0" for whole numbers, "{GRADER} {N.M}" for decimals
      const n = (g.match(/\d+(?:\.\d+)?/) || [])[0];
      if (n != null) {
        const num = parseFloat(n);
        const formatted = Number.isInteger(num) ? `${num}.0` : String(num);
        metaCond["grade"].push(graderAbbrev ? `${graderAbbrev} ${formatted}` : formatted);
      }
    }
    metaCond["grade"] = [...new Set(metaCond["grade"])];

    const lang = document.getElementById("language")?.value;
    if (lang) metaCond["language"] = [lang];

    const collAddresses = ["BSG6DyEihFFtfvxtL9mKYsvTwiZXB1rq5gARMTJC2xAM", "phygZDQZJZVHvJGYPGoKPYUtXw7mstSYtTtcuh8LJcC"];
    const pageSize = 48;
    let page = 0;
    let cards = [];
    try {
      await getSolPrice();
      await getJpyRate();
      while (page <= 100) {
        // Build query string to match Phygitals URL format:
        // metadataConditions: encode only {, }, " and space (as +); leave :, ,, [ ] literal
        // priceRange/fmvRange: ["",""] with encoded quotes; collectionAddresses: encode only quotes
        const metaRaw = JSON.stringify(metaCond)
          .replace(/{/g, '%7B').replace(/}/g, '%7D')
          .replace(/"/g, '%22').replace(/ /g, '+');
        const collRaw = JSON.stringify(collAddresses).replace(/"/g, '%22');
        const qs = `searchTerm=&sortBy=price-low-high&itemsPerPage=${pageSize}&page=${page}&metadataConditions=${metaRaw}&priceRange=[%22%22,%22%22]&fmvRange=[%22%22,%22%22]&listedStatus=listed&collectionAddresses=${collRaw}`;
        const res = await fetch(`${WORKER_URL}/phygitals/listings?${qs}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawItems = data.listings ?? data.data ?? data.items ?? [];
        const newCards = rawItems.map(normalizePhygitalsCard).filter(c => c.listing?.price != null);
        cards = cards.concat(newCards);
        status.textContent = `${cards.length} Phygitals listings…`;
        const total = data.amount ?? data.total ?? data.totalCount ?? data.totalItems ?? 0;
        const totalPages = data.totalPages ?? data.total_pages ?? Math.ceil(total / pageSize);
        if (rawItems.length < pageSize || page >= totalPages - 1) break;
        page++;
      }
      allRows = cards;
      currentPage = 1;
      applyLiveFilters();
      if (!cards.length) document.getElementById("empty-msg").style.display = "block";
      status.textContent = `${cards.length} Phygitals listings loaded`;
      window.scrollTo(0, 0);
      enableRefreshButtons();
      fetchAltPrices(cards).then(() => fetchSnkrdunkPrices(cards));
      fetchClForVisible();
    } catch (e) {
      status.textContent = `Phygitals error: ${e.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  function saveCardCache(rows, filters, page, pages, statusText) {
    try {
      localStorage.setItem("cardListCache", JSON.stringify({ rows, filters, page, pages, statusText, savedAt: Date.now() }));
    } catch {} // quota exceeded — skip silently
  }

  // CL results persist in localStorage (24h TTL) rather than sessionStorage:
  // CardLadder has a small daily quota, so re-spending it after every browser
  // restart on certs we already looked up is pure waste. Quota-exceeded
  // markers are session-only — the quota resets daily.
  const CL_CACHE_TTL_MS = 24 * 60 * 60 * 1000;

  function savePriceCache() {
    try {
      sessionStorage.setItem("altCacheData", JSON.stringify([...altCache.entries()]));
      sessionStorage.setItem("snkrdunkCacheData", JSON.stringify([...snkrdunkCache.entries()]));
      const clEntries = [...clCache.entries()].filter(([, v]) => v && !v.quotaExceeded);
      localStorage.setItem("clCacheData", JSON.stringify(clEntries));
    } catch {}
  }

  function loadClCache() {
    try {
      const entries = JSON.parse(localStorage.getItem("clCacheData") || "[]");
      const cutoff = Date.now() - CL_CACHE_TTL_MS;
      for (const [k, v] of entries) {
        if (v && v._t && v._t > cutoff) clCache.set(k, v);
      }
    } catch {}
  }

  async function loadCardCache() {
    try {
      const raw = localStorage.getItem("cardListCache");
      if (!raw) return;
      const cached = JSON.parse(raw);
      if (!cached?.rows?.length) return;
      if (cached.savedAt && Date.now() - cached.savedAt > 3600_000) return; // 1-hour TTL
      // Restore filter selects
      const f = cached.filters || {};
      const filterMap = { categories: "categories", gradingCompany: "gradingCompany", language: "language", orderBy: "orderBy", step: "step" };
      for (const [param, id] of Object.entries(filterMap)) {
        const el = document.getElementById(id);
        if (el && f[param] != null) el.value = f[param];
      }
      // Rebuild grade options for the restored company, then restore selections
      updateGradeOptions();
      if (f.grade != null) {
        const gradeValues = f.grade ? f.grade.split(",") : [];
        document.querySelectorAll('#grade-menu input[type="checkbox"]').forEach(cb => {
          cb.checked = gradeValues.length === 0 ? cb.value === "" : gradeValues.includes(cb.value);
        });
        if (!document.querySelector('#grade-menu input[type="checkbox"]:checked')) {
          const anyBox = document.querySelector('#grade-menu input[value=""]');
          if (anyBox) anyBox.checked = true;
        }
        updateGradeLabel();
      }
      // Restore price caches before repopulating cells
      try {
        const altEntries = JSON.parse(sessionStorage.getItem("altCacheData") || "[]");
        for (const [k, v] of altEntries) altCache.set(k, v);
        const snkrEntries = JSON.parse(sessionStorage.getItem("snkrdunkCacheData") || "[]");
        for (const [k, v] of snkrEntries) snkrdunkCache.set(k, v);
      } catch {}
      allRows = cached.rows;
      currentPage = cached.page ?? 1;
      totalPages = cached.pages ?? 1;
      await getSolPrice();
      await getJpyRate();
      if (cacheLoadAborted) return; // fetchListings was called while we were awaiting
      updatePagination(totalPages);
      document.getElementById("status").textContent = (cached.statusText || "") + " (cached)";
      enableRefreshButtons();
      applyLiveFilters();
      // If any Japanese cards are missing SNKRDUNK prices (e.g. key changed after alt data loaded),
      // trigger a background fetch so they fill in without requiring a manual refresh.
      const needsSnkr = allRows.some(c =>
        c.gradingID && (!c.language || c.language.toLowerCase() === "japanese") &&
        !snkrdunkCache.has(snkrdunkKwKey(c))
      );
      if (needsSnkr) fetchSnkrdunkPrices(allRows);
      const needsCl = allRows.some(c => c.gradingID && clGrader(c) && !clCache.has(c.gradingID));
      if (needsCl) fetchClForVisible();
    } catch {}
  }

    await fetchListings(true, true);
  }

  // CL defaults to off: CardLadder has a small daily request quota, so its
  // prices are only fetched while its columns are visible.
  const SOURCE_TOGGLE_DEFAULTS = { alt: true, cl: false, snkrdunk: true };

  function sourceEnabled(source) {
    return document.getElementById(`toggle-${source}`)?.classList.contains("active") ?? false;
  }

  function syncClRefreshBtn() {
    const btn = document.getElementById("refresh-cl-btn");
    if (btn) btn.style.display = sourceEnabled("cl") ? "" : "none";
  }

  function initSourceToggles() {
    let saved = {};
    try { saved = JSON.parse(sessionStorage.getItem("sourceToggles") || "{}"); } catch {}
    const table = document.getElementById("results-table");
    for (const [source, def] of Object.entries(SOURCE_TOGGLE_DEFAULTS)) {
      const on = saved[source] ?? def;
      document.getElementById(`toggle-${source}`)?.classList.toggle("active", on);
      table.classList.toggle(`hide-${source}`, !on);
    }
    syncClRefreshBtn();
  }

  function toggleSource(source) {
    const btn = document.getElementById(`toggle-${source}`);
    const table = document.getElementById("results-table");
    btn.classList.toggle("active");
    const on = btn.classList.contains("active");
    table.classList.toggle(`hide-${source}`, !on);
    try {
      const saved = JSON.parse(sessionStorage.getItem("sourceToggles") || "{}");
      saved[source] = on;
      sessionStorage.setItem("sourceToggles", JSON.stringify(saved));
    } catch {}
    if (source === "cl") {
      syncClRefreshBtn();
      if (on && allRows.length) fetchClForVisible();
    }
  }

  window.addEventListener("beforeunload", savePriceCache);

  document.getElementById("results-body").addEventListener("click", e => {
    const tr = e.target.closest("tr");
    if (!tr) return;
    const already = tr.classList.contains("selected");
    document.querySelectorAll("#results-body tr.selected").forEach(r => r.classList.remove("selected"));
    if (!already) tr.classList.add("selected");
  });

  // ── Grade multi-select ───────────────────────────────────────────────
  // Values are the grade strings each platform's API expects (PSA/BGS/CGC
  // official label formats). TAG and AGS have no per-grade filter support
  // yet, so they fall back to "Any grade" only.
  const GRADE_OPTIONS = {
    PSA: [
      { label: "GEM-MT 10", value: "GEM-MT 10" },
      { label: "MINT 9",    value: "MINT 9"    },
      { label: "NM-MT 8",   value: "NM-MT 8"   },
      { label: "NM 7",      value: "NM 7"      },
      { label: "EX-MT 6",   value: "EX-MT 6"   },
      { label: "EX 5",      value: "EX 5"      },
      { label: "VG-EX 4",   value: "VG-EX 4"   },
      { label: "VG 3",      value: "VG 3"      },
      { label: "GOOD 2",    value: "GOOD 2"    },
      { label: "PR 1",      value: "PR 1"      },
    ],
    Beckett: [
      { label: "Black Label 10", value: "10-PRISTINE BLACK LABEL" },
      { label: "Pristine 10",    value: "10-PRISTINE"             },
      { label: "Gem Mint 9.5",   value: "9.5-GEM MINT"           },
      { label: "Mint 9",         value: "9-MINT"                  },
      { label: "NM-MT 8",        value: "8-NM-MT"                },
      { label: "Near Mint 7",    value: "7-NEAR MINT"            },
      { label: "EX-NM 6",        value: "6-EX-NM"               },
      { label: "Excellent 5",    value: "5-EXCELLENT"            },
      { label: "VG-EX 4",        value: "4-VG-EX"               },
      { label: "Very Good 3",    value: "3-VERY GOOD"            },
      { label: "Good 2",         value: "2-GOOD"                 },
      { label: "Poor 1",         value: "1-POOR"                 },
    ],
    CGC: [
      { label: "Pristine 10",  value: "PRISTINE 10"   },
      { label: "Gem Mint 10",  value: "GEM MINT 10"   },
      { label: "Mint+ 9.5",    value: "MINT+ 9.5"    },
      { label: "Mint 9",       value: "MINT 9"        },
      { label: "NM/Mint+ 8.5", value: "NM/MINT+ 8.5" },
      { label: "NM/Mint 8",    value: "NM/MINT 8"    },
    ],
  };

  function updateGradeOptions() {
    const company = document.getElementById("gradingCompany").value;
    const options = GRADE_OPTIONS[company] || [];
    const menu = document.getElementById("grade-menu");
    const rows = options.map(opt =>
      `<label><input type="checkbox" value="${esc(opt.value)}" onchange="onGradeCheck(this)" />${opt.label}</label>`
    );
    rows.push(`<label><input type="checkbox" value="" onchange="onGradeCheck(this)" />Any grade</label>`);
    menu.innerHTML = rows.join("");
    // Client-filter/paginate platforms default to Any grade; CC defaults to first specific grade
    const pf = activePlatform();
    const toCheck = (pf.clientFilter || pf.paginate)
      ? menu.querySelector('input[value=""]')
      : menu.querySelector('input[type="checkbox"]');
    if (toCheck) { toCheck.checked = true; updateGradeLabel(); }
    if (pf.clientFilter) applyLiveFilters();
  }

  function onGradeCheck(cb) {
    const allBoxes = [...document.querySelectorAll('#grade-menu input[type="checkbox"]')];
    const anyBox = document.querySelector('#grade-menu input[value=""]');
    if (cb.value === "") {
      if (cb.checked) allBoxes.filter(c => c !== cb).forEach(c => c.checked = false);
    } else {
      if (cb.checked && anyBox) anyBox.checked = false;
    }
    if (!allBoxes.some(c => c.checked) && anyBox) anyBox.checked = true;
    updateGradeLabel();
    if (activePlatform().clientFilter) applyLiveFilters();
  }

  function getSelectedGrades() {
    return [...document.querySelectorAll('#grade-menu input[type="checkbox"]:checked')]
      .map(cb => cb.value).filter(v => v !== "");
  }

  function updateGradeLabel() {
    const grades = getSelectedGrades();
    const anyBox = document.querySelector('#grade-menu input[value=""]:checked');
    const label = document.getElementById("grade-label");
    if (!label) return;
    if (anyBox || grades.length === 0) {
      label.textContent = "Any grade";
    } else if (grades.length === 1) {
      const cb = document.querySelector(`#grade-menu input[value="${CSS.escape(grades[0])}"]`);
      label.textContent = cb?.closest('label')?.textContent.trim() ?? grades[0];
    } else {
      label.textContent = `${grades.length} grades`;
    }
  }

  function toggleGradeMenu() {
    const menu = document.getElementById("grade-menu");
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  }

  document.addEventListener("click", e => {
    const wrap = document.getElementById("grade-wrap");
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById("grade-menu").style.display = "none";
    }
  });
  // ─────────────────────────────────────────────────────────────────────

  // Restore from cache on page refresh — must run after all const/let declarations
  // are initialized (calling earlier causes TDZ ReferenceErrors that are silently swallowed)
  initSourceToggles();
  loadClCache();
  updateGradeOptions();
  if (sessionStorage.getItem("auth") === "1") loadCardCache();

  window._row = () => allRows[0]; // debug: inspect first card's fields

  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
